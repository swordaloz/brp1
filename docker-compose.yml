services:
  asistencia:
    build: .
    container_name: brp-asistencia
    restart: unless-stopped
    environment:
      # Nombre que se muestra en la interfaz (rebranding rápido).
      EMPRESA: "${EMPRESA:-Lear Corporation}"
      TZ: "America/Mexico_City"
      DATA_DIR: "/data"
    volumes:
      - ./data:/data          # la base SQLite vive aquí (persistente)
    ports:
      - "127.0.0.1:${PORT:-8090}:8000"   # solo local; el reverse proxy expone HTTPS
