<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eventos</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-name">Control de Asistencia</span></div>
    <nav>
      <a href="/">Escaneo</a>
      <a href="/eventos" class="active">Eventos</a>
      <a href="/empleados">Empleados</a>
    </nav>
  </header>

  <div class="wrap">
    <div class="grid">
      <!-- Crear evento -->
      <div class="card">
        <h2>Crear evento</h2>
        <div class="field">
          <label>Nombre del evento *</label>
          <input id="e-nombre" class="txt" placeholder="Ej. Curso de seguridad industrial" />
        </div>
        <div class="two">
          <div class="field">
            <label>Tipo / curso</label>
            <input id="e-tipo" class="txt" placeholder="Capacitación, junta…" />
          </div>
          <div class="field">
            <label>Fecha</label>
            <input id="e-fecha" class="txt" type="date" />
          </div>
        </div>
        <div class="field">
          <label>Detalles</label>
          <textarea id="e-detalles" class="txt" placeholder="Lugar, instructor, notas…"></textarea>
        </div>
        <div class="field">
          <label>Invitados — selecciona quiénes asisten</label>
          <input id="e-buscar" class="txt" placeholder="Buscar empleado…" style="margin-bottom:8px" />
          <div class="row" style="margin-bottom:8px">
            <button class="btn sm ghost" id="sel-todos" type="button">Seleccionar todos</button>
            <button class="btn sm ghost" id="sel-ninguno" type="button">Ninguno</button>
            <span class="muted" id="sel-count" style="margin-left:auto">0 seleccionados</span>
          </div>
          <div class="checklist" id="checklist"></div>
        </div>
        <div class="row">
          <button class="btn primary" id="crear">Crear evento</button>
          <span id="crear-msg" class="muted"></span>
        </div>
      </div>

      <!-- Histórico -->
      <div class="card">
        <h2>Histórico de eventos</h2>
        <div id="lista-eventos"></div>
      </div>
    </div>
  </div>

  <!-- Modal detalle -->
  <div class="modal-back" id="modal">
    <div class="modal">
      <button class="btn ghost sm close-x" id="cerrar">✕ Cerrar</button>
      <h2 id="m-titulo">Evento</h2>
      <div id="m-info" class="muted" style="margin-bottom:14px"></div>

      <div class="stats" style="grid-template-columns:repeat(4,1fr)">
        <div class="stat"><div class="num" id="m-inv">0</div><div class="lbl">Invitados</div></div>
        <div class="stat"><div class="num" id="m-pres" style="color:#4ade80">0</div><div class="lbl">Presentes</div></div>
        <div class="stat"><div class="num" id="m-aus" style="color:#f59e0b">0</div><div class="lbl">Faltan</div></div>
        <div class="stat"><div class="num" id="m-walk">0</div><div class="lbl">No invitados</div></div>
      </div>

      <div class="row" style="margin-bottom:14px">
        <a class="btn" id="m-usar" href="/">▶ Usar en la estación</a>
        <a class="btn" id="m-export">⬇ Exportar CSV</a>
        <button class="btn danger sm" id="m-borrar" style="margin-left:auto">Eliminar evento</button>
      </div>

      <h3 style="font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Lista</h3>
      <div class="rlist" id="m-roster" style="max-height:300px"></div>

      <div style="margin-top:16px">
        <label class="muted" style="font-size:.82rem;font-weight:600">Agregar invitado (código de empleado)</label>
        <div class="row" style="margin-top:6px">
          <input id="m-addcod" class="txt" placeholder="Código del gafete" style="flex:1" />
          <button class="btn sm" id="m-add">Agregar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/eventos.js"></script>
</body>
</html>
